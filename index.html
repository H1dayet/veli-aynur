<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<link rel="icon" href="assets/flake-2.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/curtain.webp">
<link rel="preload" as="image" href="assets/wreath.webp">
<link rel="preload" as="image" href="assets/ballroom.webp">
<link rel="preload" as="image" href="assets/hero.webp">
<link rel="stylesheet" href="style.css?v=10"><!-- bump ?v= on every change so phones skip their cached copy -->

<script>
// ===== EDIT ONLY THIS BLOCK =====
const CONFIG = {
  groom: 'Вели',
  bride: 'Айнур',
  date: '2026-12-04T18:00:00+05:00',   // ISO, with the venue's timezone offset
  timeZone: 'Asia/Ashgabat',
  greeting: 'Два сердца, одна судьба. С огромной радостью приглашаем вас разделить с нами самый счастливый день — день, когда начинается наша семья.',
  events: [
    { title: 'Свадебное торжество', time: '18:00', place: 'Ресторан «Гуль земин»', address: 'Большой зал «Алтын»' },
  ],
  program: [                            // evening program, shown under «Где и когда»
    { time: '18:00', title: 'Сбор гостей' },
    { time: '18:30', title: 'Торжественный выход молодожёнов' },
    { time: '19:00', title: 'Начало праздничной программы' },
    { time: '21:00', title: 'Свадебный торт' },
    { time: '22:30', title: 'Завершение вечера' },
  ],
  mapQuery: '',  // Google Maps search text or "lat,lng" (not shown to guests); '' hides the map. Google doesn't find «Гуль земин» by name.
  closing: 'Ваше присутствие — самый ценный подарок для нас. С нетерпением ждём встречи с вами в этот зимний вечер!',
  music: 'assets/music.mp3',            // '' for no music
};
</script>
</head>
<body class="locked">

<!-- ===== Cover: velvet curtains in front of the ballroom ===== -->
<div class="gate" id="gate">
  <img class="gate-room" src="assets/ballroom.webp" alt="">
  <img class="curtain curtain-l" src="assets/curtain.webp" alt="">
  <img class="curtain curtain-r" src="assets/curtain.webp" alt="">
  <div class="glow" aria-hidden="true"></div>
  <div class="hangers" data-hang="7" aria-hidden="true"></div>

  <div class="cover">
    <div class="monogram">
      <img src="assets/wreath.webp" alt="">
      <p><span data-c="g0"></span><i>&amp;</i><span data-c="b0"></span></p>
    </div>
    <p class="cover-names" data-c="couple"></p>
    <p class="cover-date" data-c="dateDots"></p>
    <p class="cover-to"><strong>Дорогой гость</strong>приглашаем вас на нашу свадьбу</p>
    <button class="btn" id="open">Открыть приглашение</button>
  </div>
</div>

<div class="snow" aria-hidden="true"></div>

<main>
  <!-- Hero: the couple -->
  <section class="hero">
    <img class="hero-img" src="assets/hero.webp" alt="Вели и Айнур держатся за руки на набережной Босфора">
    <div class="hangers" data-hang="6" aria-hidden="true"></div>
    <div class="hero-text">
      <p class="kicker">Свадебное торжество</p>
      <h1 class="names">
        <span data-c="groom"></span>
        <span class="amp">&amp;</span>
        <span data-c="bride"></span>
      </h1>
      <p class="hero-date" data-c="dateLong"></p>
    </div>
    <span class="scroll-line" aria-hidden="true"></span>
  </section>

  <div class="paper">
    <img class="corner corner-top" src="assets/corner-top.webp" alt="" loading="lazy">
    <img class="corner corner-bottom" src="assets/corner-bottom.webp" alt="" loading="lazy">
    <!-- Greeting -->
    <section class="greeting">
      <p class="verse" id="verse" data-c="greeting"></p>
    </section>

    <figure class="frame tilt-l">
      <img src="assets/photo-1.webp" alt="Айнур оборачивается, держа Вели за руку" loading="lazy" width="900" height="1350">
      <figcaption>Вместе — навсегда</figcaption>
    </figure>

    <!-- Date -->
    <section class="date">
      <h2 class="title">Сохраните дату</h2>
      <div class="cal">
        <p class="cal-head" data-c="monthYear"></p>
        <div class="cal-grid" id="cal"></div>
      </div>
      <div class="timer" id="timer" aria-live="off">
        <div><b id="d">0</b><span>дней</span></div>
        <div><b id="h">00</b><span>часов</span></div>
        <div><b id="m">00</b><span>минут</span></div>
        <div><b id="s">00</b><span>секунд</span></div>
      </div>
    </section>

    <!-- Venue -->
    <section class="venue">
      <h2 class="title">Где и когда</h2>
      <p class="v-day" data-c="dateLong"></p>
      <div id="events"></div>
      <div class="map"><iframe id="map" title="Карта места проведения" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
      <a class="btn dark" id="directions" target="_blank" rel="noopener">Построить маршрут</a>
    </section>

    <!-- Evening program: each line reveals as it scrolls in -->
    <section class="program">
      <h2 class="title">Программа вечера</h2>
      <ol class="timeline" id="program"></ol>
    </section>

    <figure class="frame tilt-r">
      <img src="assets/photo-2.webp" alt="Вели и Айнур на набережной у мечети Ортакёй" loading="lazy" width="900" height="1350">
      <figcaption>До встречи на нашем празднике</figcaption>
    </figure>
  </div>

  <!-- Closing: back into the winter night -->
  <section class="closing">
    <img class="closing-room" src="assets/ballroom.webp" alt="" loading="lazy">
    <div class="hangers" data-hang="5" aria-hidden="true"></div>
    <div class="closing-wreath">
      <img src="assets/wreath.webp" alt="" loading="lazy">
      <p class="closing-mono"><span data-c="g0"></span><i>&amp;</i><span data-c="b0"></span></p>
    </div>
    <p class="closing-note" data-c="closing"></p>
  </section>
  <footer><span data-c="initials"></span> · <span data-c="dateDots"></span></footer>
</main>

<button class="music" id="music" aria-label="Выключить музыку" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3Zm11-2a3 3 0 1 1-3-3 3 3 0 0 1 3 3Z"/></svg>
</button>
<audio id="audio" loop preload="none"></audio>

<script src="script.js?v=10"></script>
</body>
</html>
